name: Package 46 fetch

on:
  push:
    paths:
      - '.github/workflows/pkg46-fetch.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch verified ARV RU overlay
        shell: bash
        run: |
          set -euo pipefail
          url='https://nexus-loader.onrender.com/api/stage46overlay?part=arv'
          curl -fL --retry 3 --retry-delay 5 -o arv-sunberry-ru.zip "$url"
          unzip -t arv-sunberry-ru.zip
          unzip -l arv-sunberry-ru.zip | tee contents.txt
          test "$(unzip -Z1 arv-sunberry-ru.zip | grep -c '^Mods/Always Raining in the Valley SBV/')" -eq 10
          echo 'ARV RU overlay verified: 10 files' > verification.txt
      - name: Upload verified ARV RU overlay
        uses: actions/upload-artifact@v4
        with:
          name: pkg46-arv-sunberry-verified
          path: |
            arv-sunberry-ru.zip
            contents.txt
            verification.txt
          if-no-files-found: error
          retention-days: 7
