name: Package 46 fetch

on:
  push:
    paths:
      - '.github/workflows/pkg46-fetch.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Russian translation
        run: |
          curl -fSL 'https://nexus-loader.onrender.com/api/fetchTranslationArchive?modId=42591&raw=1' -o arv-sunberry-ru.zip
          unzip -t arv-sunberry-ru.zip
          ls -lh arv-sunberry-ru.zip
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: pkg46-arv-sunberry-ru
          path: arv-sunberry-ru.zip
          if-no-files-found: error
          retention-days: 1
