name: Package 46 fetch

on:
  push:
    paths:
      - '.github/workflows/pkg46-fetch.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Capture translation response
        shell: bash
        run: |
          set +e
          url='https://nexus-loader.onrender.com/api/fetchTranslationArchive?modId=42591&raw=1'
          curl -sS -L -D response-headers.txt -o arv-sunberry-ru.zip -w '%{http_code}\n' "$url" > http-status.txt
          file arv-sunberry-ru.zip > file-type.txt 2>&1 || true
          unzip -t arv-sunberry-ru.zip > unzip-test.txt 2>&1 || true
          ls -lh arv-sunberry-ru.zip > file-size.txt 2>&1 || true
          cat http-status.txt
          cat file-type.txt
          cat unzip-test.txt
      - name: Upload captured response
        uses: actions/upload-artifact@v4
        with:
          name: pkg46-arv-sunberry-capture
          path: |
            arv-sunberry-ru.zip
            response-headers.txt
            http-status.txt
            file-type.txt
            unzip-test.txt
            file-size.txt
          if-no-files-found: error
          retention-days: 1

