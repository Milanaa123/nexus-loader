name: Audit verified updates and persist reports

on:
  push:
    paths:
      - '.github/workflows/audit-update-batch-commit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download current archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/zips audit/out
          dl() {
            local id="$1" fid="$2" name="$3"
            curl -fL --retry 5 --retry-all-errors --connect-timeout 30 \
              -o "audit/zips/${name}.zip" \
              "https://nexus-loader.vercel.app/api/nexus?action=proxyDownload&game=stardewvalley&modId=${id}&fileId=${fid}"
          }
          dl 16491 74411 simple-weapons
          dl 18914 176020 crop-growth-adjustments
          dl 32081 178840 blinkfix
          dl 39979 179311 billboard-beautifier
          dl 44845 178219 evelyn-expansion-1.5
          dl 46356 168430 evelyn-expansion-ru-1.1
          dl 29400 177667 a-warm-welcome-1.3.1
          dl 23697 176450 mastery-extended-2.2.2

      - name: Run audit
        run: python scripts/audit_update_batch.py

      - name: Persist audit reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/review/update-audit-current
          cp audit/out/*.json data/review/update-audit-current/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review/update-audit-current
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Persist verified update RU audit reports"
            git push
          fi

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-update-batch-audit-current
          path: audit/out/*
          if-no-files-found: error
          retention-days: 7
