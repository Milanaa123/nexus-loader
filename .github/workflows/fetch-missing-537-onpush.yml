name: Fetch missing 537 source archives

on:
  push:
    paths:
      - '.github/workflows/fetch-missing-537-onpush.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Render bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 \
            -A 'Mozilla/5.0 nexus-loader/2.8' \
            -o missing-537-sources.zip \
            'https://nexus-loader.onrender.com/api/missing537bundle'
          unzip -t missing-537-sources.zip
          sha256sum missing-537-sources.zip | tee SHA256.txt
          unzip -l missing-537-sources.zip | tee CONTENTS.txt

      - name: Upload verified bundle
        uses: actions/upload-artifact@v4
        with:
          name: missing-537-render-bundle
          path: |
            missing-537-sources.zip
            SHA256.txt
            CONTENTS.txt
          if-no-files-found: error
          retention-days: 7
