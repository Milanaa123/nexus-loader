name: Fetch Stage 45 RU translations

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Stage 45 Russian translations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads normalized

          download_file() {
            local modid="$1"
            local fileid="$2"
            local label="$3"
            local ext="$4"
            echo -e "${label}\t${modid}\t${fileid}" >> downloads/STAGE45_MANIFEST.tsv
            curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
              -o "downloads/${label}.${ext}" \
              "https://nexus-loader.vercel.app/api/nexus?action=download&game=stardewvalley&modId=${modid}&fileId=${fileid}"
          }

          download_file 12760 97925 "Adventurers Guild Expanded RU 2.1.2" 7z
          download_file 34246 133043 "Dao RU 1.0.2" rar
          download_file 31958 126160 "Leilani RU 1.6 update" 7z
          download_file 41965 155810 "Rose and the Alchemist RU 2.0.2" zip
          download_file 34062 159030 "Sophia SVE Dialogue Expansion RU 1.3.1" zip
          download_file 36508 139653 "Central Station RU 1.5.0" 7z
          download_file 12066 127331 "Mister Ginger RU 1.6.6" zip
          download_file 40475 156226 "Distant Lands RU 2.2.8" zip

          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unrar-free >/dev/null
          shopt -s nullglob
          for f in downloads/*.7z downloads/*.rar; do
            base="$(basename "$f")"
            stem="${base%.*}"
            tmp="normalized/${stem}"
            mkdir -p "$tmp"
            7z x -y "$f" -o"$tmp" >/dev/null
            (cd "$tmp" && zip -qr "../../downloads/${stem} normalized.zip" .)
          done
          ls -lh downloads

      - name: Upload Stage 45 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage45-official-ru-sources
          path: downloads/*
          if-no-files-found: error
          retention-days: 7
