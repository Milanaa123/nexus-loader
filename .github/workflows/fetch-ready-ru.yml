name: Fetch ready RU translations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-ready-ru.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Russian translations and matching reference originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads reference
          # Ready Russian translations
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o "downloads/Creative Differences RU 3.2.6.zip" "https://nexus-loader.vercel.app/api/nexus?action=download&game=stardewvalley&modId=42405&fileId=156948"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o "downloads/Lurking in the Dark RU 3.0.7.rar" "https://nexus-loader.vercel.app/api/nexus?action=download&game=stardewvalley&modId=17988&fileId=130745"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o "downloads/Law and Order SV RU 1.4.11.zip" "https://nexus-loader.vercel.app/api/nexus?action=download&game=stardewvalley&modId=37449&fileId=178200"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o "downloads/Penny Event Expansion RU 2.4.0.zip" "https://nexus-loader.vercel.app/api/nexus?action=download&game=stardewvalley&modId=25751&fileId=105661"
          # Original versions corresponding to the translation baselines; used only for delta comparison.
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o "reference/Creative Differences ORIGINAL 3.2.6.zip" "https://nexus-loader.vercel.app/api/nexus?action=download&game=stardewvalley&modId=13437&fileId=154812"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o "reference/Lurking in the Dark ORIGINAL 3.0.7.zip" "https://nexus-loader.vercel.app/api/nexus?action=download&game=stardewvalley&modId=10770&fileId=130730"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o "reference/Penny Event Expansion ORIGINAL 2.4.0.zip" "https://nexus-loader.vercel.app/api/nexus?action=download&game=stardewvalley&modId=16279&fileId=105233"
          ls -lh downloads reference

      - name: Normalize RAR translation to ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lurking_extracted
          if command -v 7z >/dev/null 2>&1; then
            7z x -y "downloads/Lurking in the Dark RU 3.0.7.rar" -olurking_extracted >/dev/null
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full >/dev/null
            7z x -y "downloads/Lurking in the Dark RU 3.0.7.rar" -olurking_extracted >/dev/null
          fi
          cd lurking_extracted
          zip -qr "../downloads/Lurking in the Dark RU 3.0.7 normalized.zip" .
          cd ..

      - name: Upload translations artifact
        uses: actions/upload-artifact@v4
        with:
          name: ready-russian-translations-and-reference-originals
          path: |
            downloads/*
            reference/*
          if-no-files-found: error
          retention-days: 7
