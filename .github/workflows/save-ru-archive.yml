name: Save RU translations archive

on:
  push:
    branches: [archive-save]
    paths:
      - '.github/workflows/save-ru-archive.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  save-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Download archive from Render
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nexus-loader.onrender.com/api/downloadRuArchive'
          for i in $(seq 1 30); do
            code=$(curl -L -sS -o RU_TRANSLATIONS_107.zip -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ] && [ -s RU_TRANSLATIONS_107.zip ]; then
              break
            fi
            echo "Attempt $i: HTTP $code, waiting..."
            sleep 10
          done
          test -s RU_TRANSLATIONS_107.zip
          python - <<'PY'
          import zipfile, os, json
          p='RU_TRANSLATIONS_107.zip'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert 'manifest.json' in names, 'manifest.json missing'
              manifest=json.loads(z.read('manifest.json'))
              assert manifest['count']==107, manifest['count']
              assert len([n for n in names if n!='manifest.json'])==107
          print('archive_ok', os.path.getsize(p), 'bytes')
          PY
      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: RU_TRANSLATIONS_107
          path: RU_TRANSLATIONS_107.zip
          if-no-files-found: error
          retention-days: 90
