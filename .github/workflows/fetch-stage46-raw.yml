name: Fetch Stage 46 RU current batch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download current Stage 46 Russian translations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          download_latest() {
            local modid="$1" label="$2"
            local info fid ver orig ext
            info="$(curl -fsSL --retry 3 --connect-timeout 20 --max-time 90 "https://nexus-loader.vercel.app/api/nexus?action=files&game=stardewvalley&modId=${modid}")"
            fid="$(printf '%s' "$info" | jq -r '.data.files | map(select(.category_name=="MAIN" or .category_id==1)) | sort_by(.uploaded_timestamp) | reverse | .[0].file_id')"
            ver="$(printf '%s' "$info" | jq -r '.data.files | map(select(.category_name=="MAIN" or .category_id==1)) | sort_by(.uploaded_timestamp) | reverse | .[0].version // .[0].mod_version // "unknown"')"
            orig="$(printf '%s' "$info" | jq -r '.data.files | map(select(.category_name=="MAIN" or .category_id==1)) | sort_by(.uploaded_timestamp) | reverse | .[0].file_name')"
            test "$fid" != "null"
            ext="${orig##*.}"; case "$ext" in zip|rar|7z) ;; *) ext=zip ;; esac
            printf '%s\t%s\t%s\t%s\t%s\n' "$label" "$modid" "$fid" "$ver" "$orig" >> downloads/STAGE46_CURRENT_MANIFEST.tsv
            curl -fL --retry 3 --connect-timeout 20 --max-time 240 -o "downloads/${label}.${ext}" "https://nexus-loader.vercel.app/api/nexus?action=proxyDownload&game=stardewvalley&modId=${modid}&fileId=${fid}"
          }
          download_latest 42591 "Always Raining in the Valley RU CURRENT"
          download_latest 5539 "Canon Friendly Dialogue Expansion RU CURRENT"
          download_latest 37666 "Date Night Redux RU CURRENT"
          download_latest 30021 "Eli and Dylan RU CURRENT"
          download_latest 42319 "Haley Ever After Sweet Edition RU CURRENT"
          download_latest 42397 "Haywrites Dialogue RU CURRENT"
          download_latest 37740 "Jorts and Jean RU CURRENT"
          download_latest 33522 "Lani RU CURRENT"
          download_latest 33571 "Nora the Herpetologist RU CURRENT"
          download_latest 43799 "Part of a Saloon Breakfast RU CURRENT"
          download_latest 44532 "Rekindle Kent and Jodi RU CURRENT"
          download_latest 44738 "Sword and Sorcery RU CURRENT"
          download_latest 44822 "The Arcanian Exchange RU CURRENT"
          download_latest 18932 "The Last Smoluanu RU CURRENT"
          download_latest 37138 "Unique Winter Star RU CURRENT"
          download_latest 32980 "Wren the Plumber RU CURRENT"
          ls -lh downloads
      - name: Upload current Stage 46 batch
        uses: actions/upload-artifact@v4
        with:
          name: stage46-current-ru-sources
          path: downloads/*
          if-no-files-found: error
          retention-days: 7
