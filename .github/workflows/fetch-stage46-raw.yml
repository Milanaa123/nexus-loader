name: Fetch Stage 46 RU raw

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Stage 46 Russian translations raw
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          download_latest() {
            local modid="$1" label="$2"
            local info fid ver orig ext
            info="$(curl -fsSL --retry 2 --connect-timeout 20 --max-time 60 "https://nexus-loader.vercel.app/api/nexus?action=files&game=stardewvalley&modId=${modid}")"
            fid="$(printf '%s' "$info" | jq -r '.data.files | map(select(.category_name=="MAIN" or .category_id==1)) | sort_by(.uploaded_timestamp) | reverse | .[0].file_id')"
            ver="$(printf '%s' "$info" | jq -r '.data.files | map(select(.category_name=="MAIN" or .category_id==1)) | sort_by(.uploaded_timestamp) | reverse | .[0].version // .[0].mod_version // "unknown"')"
            orig="$(printf '%s' "$info" | jq -r '.data.files | map(select(.category_name=="MAIN" or .category_id==1)) | sort_by(.uploaded_timestamp) | reverse | .[0].file_name')"
            test "$fid" != "null"
            ext="${orig##*.}"; case "$ext" in zip|rar|7z) ;; *) ext=zip ;; esac
            printf '%s\t%s\t%s\t%s\t%s\n' "$label" "$modid" "$fid" "$ver" "$orig" >> downloads/STAGE46_MANIFEST.tsv
            curl -fL --retry 2 --connect-timeout 20 --max-time 180 -o "downloads/${label}.${ext}" "https://nexus-loader.vercel.app/api/nexus?action=download&game=stardewvalley&modId=${modid}&fileId=${fid}"
          }
          download_latest 42319 "Haley Ever After Sweet Edition RU"
          download_latest 5539 "Canon Friendly Dialogue Expansion RU"
          download_latest 30021 "Eli and Dylan RU"
          download_latest 11114 "Always Raining in the Valley RU"
          download_latest 42397 "Haywrites Dialogue RU"
          download_latest 43799 "Part of a Saloon Breakfast RU"
          download_latest 18106 "Jorts and Jean RU"
          download_latest 37666 "Date Night Redux RU"
          download_latest 37138 "Unique Winter Star RU"
          download_latest 32980 "Wren the Plumber RU"
          download_latest 33571 "Nora the Herpetologist RU"
          download_latest 44738 "Sword and Sorcery RU"
          download_latest 44822 "The Arcanian Exchange RU"
          download_latest 18932 "The Last Smoluanu RU"
          download_latest 33522 "Lani RU"
          download_latest 44532 "Rekindle Kent and Jodi RU"
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 -A 'Mozilla/5.0' -o downloads/ARV-1.5.1-current-RU-source.zip 'https://stardewmods.ru/uploads/public_files/2025-05/arvsunberry.zip'
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 -A 'Mozilla/5.0' -o downloads/Jorts-Jean-1.5.5-current-RU-source.zip 'https://stardewmods.ru/uploads/public_files/2025-03/jorts-and-jean.zip'
          ls -lh downloads
      - name: Upload Stage 46 raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage46-raw-ru-sources-current
          path: downloads/*
          if-no-files-found: error
          retention-days: 7
