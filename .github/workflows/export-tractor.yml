name: Export Tractor Mod
on:
  push:
    paths:
      - '.github/tractor-trigger.txt'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download Tractor Mod
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --max-time 300 'https://nexus-loader.onrender.com/api/tractor' -o tractor.zip
          test "$(head -c 2 tractor.zip)" = 'PK'
          sha256sum tractor.zip | tee tractor.sha256
          unzip -t tractor.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tractor-mod
          path: |
            tractor.zip
            tractor.sha256
          retention-days: 1
