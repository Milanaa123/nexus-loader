name: Export Missing 537 Localization Text
on:
  push:
    paths:
      - 'm537-export-trigger.txt'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact localization files
        run: |
          set -euo pipefail
          mkdir -p tmp/m537-text
          base='https://nexus-loader.onrender.com/api/m537text?name='
          for n in HXW_DEFAULT ANY_DEFAULT RESET_DEFAULT RESET_RU THREE_DEFAULT WEATHER_CS_DEFAULT WEATHER_CS_RU WEATHER_DLL_DEFAULT WEATHER_DLL_RU; do
            curl --fail --location --retry 4 --retry-delay 4 --max-time 300 "${base}${n}" -o "tmp/m537-text/${n}.json"
            python -m json.tool "tmp/m537-text/${n}.json" >/dev/null
          done
      - name: Commit exported text
        run: |
          git config user.name 'm537-export-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tmp/m537-text
          git commit -m 'Export exact missing 537 localization text' || exit 0
          git push
