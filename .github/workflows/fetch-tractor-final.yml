name: Fetch Tractor Final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-tractor-final.yml'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Tractor Mod through Nexus loader
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            'https://nexus-loader.onrender.com/api/tractor' \
            -o 'Tractor Mod 4.24.4.zip'
          test "$(head -c2 'Tractor Mod 4.24.4.zip')" = 'PK'
          unzip -t 'Tractor Mod 4.24.4.zip'
          sha256sum 'Tractor Mod 4.24.4.zip' | tee tractor.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tractor-mod-4.24.4
          path: |
            Tractor Mod 4.24.4.zip
            tractor.sha256
          if-no-files-found: error
# final export trigger 2026-08-31
