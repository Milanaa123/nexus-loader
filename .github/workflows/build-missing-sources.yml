name: Build missing 537 sources

on:
  push:
    paths:
      - '.github/workflows/build-missing-sources.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified source bundle
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 --max-time 600 \
            'https://nexus-loader.onrender.com/api/missing537bundle' \
            -o missing-537-sources.zip
          echo 'd2aaad6d3352ede2666ac6b71524fcff16f9ac5dac68fc7aa692c4eacfe14b85  missing-537-sources.zip' | sha256sum -c -
          unzip -t missing-537-sources.zip
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: missing-537-sources
          path: missing-537-sources.zip
          if-no-files-found: error
          retention-days: 1
