name: Capture translation archives

on:
  push:
    paths:
      - '.github/workflows/capture-translations.yml'
  pull_request:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch missing originals and current Russian translations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captured
          fetch_one() {
            id="$1"; name="$2"
            curl -fL --retry 6 --retry-all-errors --connect-timeout 30 --max-time 600 \
              -o "captured/${name}.zip" \
              "https://nexus-loader.onrender.com/api/nexus?action=proxyDownload&proxy=true&modId=${id}"
            unzip -t "captured/${name}.zip" >/dev/null
            echo "captured modId=${id}"
          }
          fetch_one 23337 'Portraited_Changing_Skies_original'
          fetch_one 4736 'DaisyNiko_Tilesheets_original'
          fetch_one 21889 'Cuter_Slimes_Refreshed_original'
          fetch_one 19487 'Coin_Icon_Replacer_original'
          fetch_one 44822 'Arcanian_Exchange_RU_current'
          fetch_one 37666 'Date_Night_Redux_RU_current'
          fetch_one 30004 'Remapping_RU_current'
      - name: Upload archive bundle
        uses: actions/upload-artifact@v4
        with:
          name: final-ru-recovery
          path: captured/*.zip
          if-no-files-found: error
          retention-days: 7
