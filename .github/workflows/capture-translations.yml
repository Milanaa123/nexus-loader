name: Capture translation archives

on:
  push:
    paths:
      - '.github/workflows/capture-translations.yml'
  pull_request:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current Russian translation archives for final audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captured
          fetch_one() {
            id="$1"; name="$2"
            curl --fail --location --retry 5 --retry-delay 5 --max-time 300 \
              "https://nexus-loader.onrender.com/api/fetchTranslationArchive?modId=${id}" \
              -o "/tmp/${id}.json"
            jq -e '.ok == true and (.base64|length) > 0' "/tmp/${id}.json" >/dev/null
            jq -r '.base64' "/tmp/${id}.json" | base64 -d > "captured/${name}.zip"
            unzip -t "captured/${name}.zip" >/dev/null
            jq -r '"captured modId=\(.modId) fileId=\(.fileId) bytes=\(.bytes)"' "/tmp/${id}.json"
          }
          fetch_one 31958 'Leilani_RU_1_6_current'
          fetch_one 40475 'Distant_Lands_RU_2_2_9_current'
      - name: Upload archive bundle
        uses: actions/upload-artifact@v4
        with:
          name: final-ru-recovery
          path: captured/*.zip
          if-no-files-found: error
          retention-days: 7
