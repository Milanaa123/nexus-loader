<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Loader</title><style>body{font-family:system-ui;background:#101217;color:#fff;max-width:900px;margin:20px auto;padding:15px}.card{background:#191c22;border:1px solid #333;padding:20px;border-radius:15px;margin:15px 0}button{padding:12px 18px;border-radius:10px;border:0;margin:5px;font-weight:bold}textarea,select{width:100%;padding:12px;margin:8px 0;background:#111;color:#fff;border:1px solid #555;border-radius:10px}pre{white-space:pre-wrap}</style></head><body><h1>Nexus Loader 2.0</h1><div class="card"><h2>Nexus Premium</h2><button onclick="go('validate')">Проверить Nexus Premium</button><pre id="out"></pre></div><div class="card"><h2>Очередь загрузки</h2><textarea id="ids">1401,3753,5509,8163,8401,11111</textarea><button onclick="queueLoad()">Подготовить очередь</button><button onclick="download()">Скачать файлы</button><pre id="q"></pre></div><script>let prepared=[];async function go(action,data={}){out.textContent='';let r=await fetch('/api/nexus',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...data})});let d=await r.json();out.textContent=JSON.stringify(d,null,2)}async function queueLoad(){q.textContent='Загрузка...';let modIds=ids.value.split(/[^0-9]+/).filter(Boolean).map(Number);let r=await fetch('/api/nexus',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'resolveQueue',modIds})});let d=await r.json();prepared=d.data?.items?.filter(x=>x.ok)||[];q.textContent=JSON.stringify(d,null,2)}function download(){if(!prepared.length)return alert('Сначала подготовьте очередь');prepared.forEach(x=>window.open(x.downloadPath,'_blank'))}</script></body></html>
