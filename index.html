<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Loader 1.4</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 18px;background:#0f1115;color:#f5f5f5}.card{background:#191c22;border:1px solid #30343d;border-radius:16px;padding:20px;margin:16px 0}button{padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #444;background:#111318;color:white;margin:8px 0}.muted{color:#aab0bb}</style></head><body><h1>Nexus Loader 1.4</h1><p class="muted">Подготовка русской сборки Stardew Valley через Nexus Mods API.</p><div class="card"><h2>Проверка Nexus</h2><button onclick="validate()">Проверить подключение</button><pre id="v"></pre></div><div class="card"><h2>Поиск мода</h2><input id="game" value="stardewvalley"><input id="modId" placeholder="Nexus mod ID, например 3753"><button onclick="files()">Получить файлы</button><pre id="f"></pre></div><script>async function call(action,extra={}){const r=await fetch('/api/nexus',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...extra})});return r.json()}async function validate(){v.textContent=JSON.stringify(await call('validate'),null,2)}async function files(){f.textContent=JSON.stringify(await call('files',{game:game.value,modId:Number(modId.value)}),null,2)}</script></body></html>
