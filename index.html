<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Loader</title><style>body{font-family:system-ui;background:#101217;color:#fff;max-width:900px;margin:30px auto;padding:15px}.card{background:#191c22;border:1px solid #333;padding:20px;border-radius:15px;margin:15px 0}button{padding:12px 18px;border-radius:10px;border:0;margin:5px;font-weight:bold}textarea,input,select{width:100%;padding:12px;margin:8px 0;background:#111;color:#fff;border:1px solid #555;border-radius:10px}pre{white-space:pre-wrap}</style></head><body><h1>Nexus Loader 1.9</h1><div class="card"><h2>Проверка Nexus Premium</h2><button onclick="validateNexus()">Проверить</button><pre id="status"></pre></div><div class="card"><h2>Очередь загрузки</h2><textarea id="ids">1401,3753,5509,8163,8401,11111</textarea><button onclick="resolveQueue()">Подготовить очередь</button><button onclick="downloadPrepared()">Скачать</button><pre id="queue"></pre></div><script>let prepared=[];async function api(action,data={}){let r=await fetch('/api/nexus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});return await r.json()}async function validateNexus(){status.textContent='Проверка...';let d=await api('validate');status.textContent=JSON.stringify(d,null,2)}async function resolveQueue(){queue.textContent='Загрузка...';let modIds=ids.value.split(/[,\s]+/).filter(Boolean).map(Number);let d=await api('resolveQueue',{modIds});if(d.ok){prepared=d.data.items.filter(x=>x.ok);queue.textContent=JSON.stringify(d.data.items,null,2)}else queue.textContent=JSON.stringify(d,null,2)}function downloadPrepared(){if(!prepared.length)return alert('Сначала подготовьте очередь');prepared.forEach(x=>window.open(x.downloadPath,'_blank'))}</script></body></html>
