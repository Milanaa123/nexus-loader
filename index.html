<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus Loader</title>
<style>
body{font-family:system-ui;background:#101217;color:#fff;max-width:1000px;margin:20px auto;padding:15px}.card{background:#191c22;border:1px solid #333;padding:20px;border-radius:15px;margin:15px 0}button{padding:12px 18px;border-radius:10px;border:0;margin:5px;font-weight:bold}textarea{width:100%;min-height:140px;background:#080a0e;color:#fff;padding:12px;border-radius:10px}pre{white-space:pre-wrap}.file{margin:10px 0}
</style>
</head>
<body>
<h1>Nexus Loader 2.8</h1>
<div class="card">
<h2>Импорт списка модов</h2>
<p>TXT: Название Автор<br>CSV: name,author</p>
<input class="file" id="file" type="file" accept=".txt,.csv">
<textarea id="mods">Tractor Mod Pathoschild
Automate Pathoschild</textarea>
<button onclick="startInput()">Запустить обработку</button>
<pre id="inputResult"></pre>
</div>
<div class="card">
<h2>Статус обработки</h2>
<button onclick="status()">Обновить статус</button>
<pre id="statusResult"></pre>
</div>
<div class="card">
<h2>Готовые архивы</h2>
<button onclick="ready()">Получить список</button>
<div id="downloads"></div>
</div>
<script>
async function startInput(){let text=document.getElementById('mods').value;let f=document.getElementById('file').files[0];if(f)text=await f.text();let r=await fetch('/api/startFromInput',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});document.getElementById('inputResult').textContent=JSON.stringify(await r.json(),null,2)}
async function status(){let r=await fetch('/api/packStatus');document.getElementById('statusResult').textContent=JSON.stringify(await r.json(),null,2)}
async function ready(){let r=await fetch('/api/packStatus');let j=await r.json();let items=j.ready||j.results||[];document.getElementById('downloads').innerHTML=items.map(x=>`<div>${x.name||x.file}<a href="/api/downloadReady?file=${encodeURIComponent(x.file||x.archive)}"> скачать</a></div>`).join('')||'Нет готовых архивов'}
</script>
</body>
</html>
